<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | DriftLink_Demo</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>

      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">DriftLink_Demo</div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/UNITYGL-DriftLink.loader.js";

      var config = {
        arguments: [],
        dataUrl: buildUrl + "/UNITYGL-DriftLink.data",
        frameworkUrl: buildUrl + "/UNITYGL-DriftLink.framework.js",
        codeUrl: buildUrl + "/UNITYGL-DriftLink.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "DriftLink_Demo",
        productVersion: "3.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      let ws = null;
      let pingInterval = null;

      function startPing(unityInstance) {
        pingInterval = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            const t = Date.now();
            ws.send("PING," + t);
          }
        }, 1000);
      }

      function startWebSocket(unityInstance) {
        console.log("Connecting WebSocket…");

        //ws = new WebSocket("ws://" + window.location.hostname + ":1880/ws");
        ws = new WebSocket("ws://192.168.0.111:1880/ws");

        ws.onopen = () => {
          console.log("WebSocket connected!");
          startPing(unityInstance);
        };

        ws.onmessage = (event) => {
          let line = event.data.trim();

          // ---- PONG (delay measurement) ----
          if (line.startsWith("PONG")) {
            const parts = line.split(",");
            if (parts.length === 2) {
              const sentTime = parseInt(parts[1]);
              const rtt = Date.now() - sentTime;

              console.log("RTT:", rtt, "ms");

              // Optional: forward delay to Unity
              unityInstance.SendMessage(
                "WebInputRouter",
                "OnWebInput",
                "DELAY," + rtt
              );
            }
            return;
          }

          // ---- Normal data ----
          console.log("WS:", line);
          unityInstance.SendMessage("WebInputRouter", "OnWebInput", line);
        };

        ws.onerror = (err) => {
          console.log("WebSocket error:", err);
        };

        ws.onclose = () => {
          console.log("WebSocket closed. Reconnecting in 2s...");
          if (pingInterval) clearInterval(pingInterval);
          setTimeout(() => startWebSocket(unityInstance), 2000);
        };
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";

          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          // Start WebSocket AFTER Unity is ready
          startWebSocket(unityInstance);

        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
